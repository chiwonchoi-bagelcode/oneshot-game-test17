<style>@font-face { font-family: 'Fredoka'; src: url('assets/fonts/fredoka.woff2') format('woff2'); font-weight: 400 800; font-display: swap; } @font-face { font-family: 'Jua'; src: url('assets/fonts/jua.woff2') format('woff2'); font-weight: 400 800; font-display: swap; } :root { --ink: #3a2416; --ink2: #6b4a32; --cream: #fff6e2; --cream2: #ffeccc; --paper: #fffaf0; --blue: #3d8ee8; --blue-d: #2a62b8; --sky: #dff4ff; --yellow: #ffcf3d; --yellow-d: #d9951f; --green: #6cc04a; --green-d: #3f8a2a; --pink: #ff7fa3; --pink-d: #d9507a; --violet: #b57ae8; --shadow: 0 5px 0 rgba(58, 36, 22, .45); --font: 'Fredoka', 'Jua', system-ui, sans-serif; --sat: env(safe-area-inset-top, 0px); --sab: env(safe-area-inset-bottom, 0px); --sal: env(safe-area-inset-left, 0px); --sar: env(safe-area-inset-right, 0px); } * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; } html, body { margin: 0; height: 100%; overflow: hidden; background: #3f7a2a; color: var(--ink); font-family: var(--font); user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; touch-action: none; overscroll-behavior: none; } canvas#game { position: fixed; left: 0; top: 0; display: block; touch-action: none; } #ui, #modals { position: fixed; inset: 0; pointer-events: none; } #ui > *, #modals > * { pointer-events: auto; } button { font-family: inherit; color: inherit; } .ico { display: inline-block; flex: none; background-repeat: no-repeat; vertical-align: middle; } /* ---------------------------------------------------------------- buttons */ .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 58px; min-width: 120px; padding: 6px 22px; border-radius: 18px; border: 3px solid var(--ink); box-shadow: var(--shadow); font-size: 21px; font-weight: 700; line-height: 1.15; background: var(--cream); cursor: pointer; transition: transform .08s, box-shadow .08s, filter .2s; text-align: center; touch-action: manipulation; } .btn:active { transform: transl variant-numeric: tabular-nums; } .pop { animation: pop .25s ease-out; } @keyframes pop { 0% { transform: scale(1) } 40% { transform: scale(1.14) } 100% { transform: scale(1) } } .shake { animation: shake .3s; } @keyframes shake { 20% { transform: translateX(-4px) } 40% { transform: translateX(4px) } 60% { transform: translateX(-3px) } 80% { transform: translateX(2px) } } /* ---------------------------------------------------------------- HUD */ .play-ui { position: fixed; inset: 0; pointer-events: none; } .play-ui button { pointer-events: auto; } .hud { position: absolute; left: 0; right: 0; top: 0; padding: calc(var(--sat) + 8px) calc(var(--sar) + 10px) 0 calc(var(--sal) + 10px); pointer-events: none; } .hud-top { display: flex; align-items: center; gap: 10px; } .hud-pause { width: 52px; height: 52px; min-width: 52px; } .hud-hp { flex: 1; display: flex; align-items: center; min-width: 0; position: relative; } .hud-hp-ic { margin-right: -12px; z-index: 1; filter: drop-shadow(0 2px 0 rgba(58, 36, 22, .5)); } .bar { position: relative; flex: 1; height: 28px; border-radius: 14px; border: 3px solid var(--ink); background: rgba(58, 36, 22, .55); overflow: hidden; box-shadow: 0 3px 0 rgba(58, 36, 22, .35); } .bar.thin { height: 16px; border-width: 2.5px; } .bar-fill { position: absolute; left: 0; top: 0; bottom: 0; width: 100%; border-radius: 11px; transition: width .18s; } .bar-fill.hp { background: linear-gradient(#ffb0c4, #ff6f91 60%, #e8507a); } .bar-fill.hp.low { animation: lowhp .7s infinite alternate; } @keyframes lowhp { from { filter: brightness(1) } to { filter: brightness(1.35) } } .bar-fill.xp { background: linear-gradient(#c2f0ff, #4fc3f7 60%, #2a9fd8); } .bar-text { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: #fff; font-size: 16px; font-weight: 700; text-shadow: 0 1.5px 0 var(--ink), 0 -1px 0 var(--ink), 1px 0 0 var(--ink), -1px 0 0 var(--ink); font-variant-numeric: tabular-nums; } .hud-coins { height: 44 s: none !important; max-width: calc(100vw - 32px); min-width: 200px; } .banner.show { opacity: 1; transform: translate(-50%, 0); } .banner-title { font-size: 15px; color: var(--ink2); font-weight: 700; } .banner-sub { font-size: 23px; font-weight: 700; } .banner-desc { font-size: 16px; color: var(--ink2); } .toast { position: fixed; left: 50%; bottom: calc(var(--sab) + 96px); transform: translate(-50%, 20px); display: flex; align-items: center; gap: 8px; padding: 10px 18px; background: rgba(58, 36, 22, .9); color: #fff; border-radius: 20px; font-size: 18px; font-weight: 700; opacity: 0; transition: .25s; pointer-events: none !important; max-width: calc(100vw - 32px); text-align: center; } .toast.show { opacity: 1; transform: translate(-50%, 0); } .fade { position: fixed; inset: 0; background: #e8f8ff; opacity: 0; transition: opacity .35s; pointer-events: none !important; } .fade.on { opacity: 1; } .joy { position: fixed; left: 0; top: 0; width: 0; height: 0; display: none; pointer-events: none !important; } .joy::before { content: ''; position: absolute; left: -60px; top: -60px; width: 120px; height: 120px; border-radius: 50%; background: rgba(255, 255, 255, .16); border: 4px solid rgba(255, 255, 255, .65); box-shadow: 0 0 0 2px rgba(58, 36, 22, .25); } .joy-knob { position: absolute; left: -28px; top: -28px; width: 56px; height: 56px; border-radius: 50%; background: rgba(255, 255, 255, .9); border: 3px solid rgba(58, 36, 22, .6); } .ribbon { position: fixed; left: 50%; top: 34%; transform: translate(-50%, -50%) scale(.5); opacity: 0; text-align: center; pointer-events: none !important; transition: opacity .2s, transform .35s cubic-bezier(.3, 1.6, .5, 1); width: max-content; max-width: calc(100vw - 32px); } .ribbon.show { opacity: 1; transform: translate(-50%, -50%) scale(1); } .ribbon-title { font-size: 38px; font-weight: 700; color: #fff; line-height: 1.1; text-shadow: 0 3px 0 #1f6fae, 0 -2px 0 #1f6fae, 2px 0 0 #1f6fae, -2px 0 0 #1f6fae, 2px 2px 0 #1f6fae, -2px 2px 0 #1f6fae, 0 7px 0 rgba(30, 40, 80, .35); } .ribbon-sub { margin-top: 6px; font-size: 20px; font-weight: 700; color: #fff; text-shadow: 0 2px 0 var(--ink), 0 -1px 0 var(--ink), 1px 0 0 var(--ink), -1px 0 0 var(--ink); } .ribbon.rescue .ribbon-title { color: #fff3a0; text-shadow: 0 3px 0 #c26a1f, 0 -2px 0 #c26a1f, 2px 0 0 #c26a1f, -2px 0 0 #c26a1f, 2px 2px 0 #c26a1f, -2px 2px 0 #c26a1f, 0 7px 0 rgba(80, 40, 10, .35); } .ribbon.warn .ribbon-title { color: #ffd0e8; text-shadow: 0 3px 0 #7d2aa0, 0 -2px 0 #7d2aa0, 2px 0 0 #7d2aa0, -2px 0 0 #7d2aa0; } .ribbon.small .ribbon-title { font-size: 30px; } /* ---------------------------------------------------------------- modals */ .modal-back { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; padding: calc(var(--sat) + 12px) calc(var(--sar) + 12px) calc(var(--sab) + 12px) calc(var(--sal) + 12px); background: rgba(34, 20, 44, .55); opacity: 0; transition: opacity .2s; } .modal-back.show { opacity: 1; } .modal-back.hide { opacity: 0; } .modal-card { width: min(460px, 100%); max-height: 100%; display: flex; flex-direction: column; background: var(--cream); border: 4px solid var(--ink); border-radius: 26px; box-shadow: 0 8px 0 rgba(58, 36, 22, .45); overflow: hidden; transform: scale(.92); transition: transform .22s cubic-bezier(.3, 1.5, .5, 1); } .modal-back.show .modal-card { transform: scale(1); } .modal-head { flex: none; display: flex; align-items: center; gap: 10px; min-height: 68px; padding: 8px 10px 8px 16px; background: linear-gradient(#ffe27a, var(--yellow)); border-bottom: 4px solid var(--ink); } .modal-head.bare { background: none; border: 0; min-height: 0; position: absolute; right: 8px; top: 8px; z-index: 2; padding: 0; } .modal-title { font-size: 25px; font-weight: 700; line-height: 1.15; flex: 1; min-width: 0; overflow-wrap: anywhere; } .modal-body { flex: 1 1 auto; overflow-y: auto; overflow-x: hidden; padding: 16px; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; touch-action: pan-y; } .modal-body.nopad { padding: 0; } /* level up */ .levelup { display: flex; flex-direction: column; gap: 12px; } .levelup-sub { text-align: center; font-size: 18px; color: var(--ink2); } .skill-card { display: flex; align-items: center; gap: 12px; width: 100%; min-height: 96px; padding: 10px 14px; border: 3px solid var(--ink); border-radius: 20px; background: var(--paper); box-shadow: var(--shadow); text-align: left; cursor: pointer; transition: transform .1s; animation: cardIn .35s backwards; } .skill-card:nth-child(3) { animation-delay: .06s } .skill-card:nth-child(4) { animation-delay: .12s } @keyframes cardIn { from { transform: translateY(30px) scale(.9); opacity: 0 } } .skill-card:active { transform: translateY(3px); } .skill-card.picked { background: #fff3b0; transform: scale(1.04); } .skill-ic { background-color: var(--sky); border-radius: 16px; border: 2.5px solid var(--ink); } .skill-txt { flex: 1; min-width: 0; } .skill-name { font-size: 21px; font-weight: 700; } .skill-desc { font-size: 16px; color: var(--ink2); line-height: 1.25; margin-top: 2px; overflow-wrap: anywhere; } .skill-dots { display: flex; gap: 4px; margin-top: 6px; } .sdot { width: 13px; height: 13px; border-radius: 50%; border: 2px solid var(--ink); background: #fff; } .sdot.on { background: var(--blue); } .sdot.next { background: var(--yellow); } .pause, .revive { display: flex; flex-direction: column; align-items: stretch; gap: 14px; } .pause-note, .revive-desc { text-align: center; font-size: 17px; color: var(--ink2); line-height: 1.3; } .revive-art { display: flex; justify-content: center; } /* ---------------------------------------------------------------- loading */ #loading { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px; background: linear-gradient(#bfeaff, #e8f8ff 45%, #9bd86a 46%, #6fb64a); transition: opacity .4s; z-index: 10; } #loading.done { opacity: 0; pointer-events: n
